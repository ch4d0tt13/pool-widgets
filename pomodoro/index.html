<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 뽀모도로</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="pomodoro.css">
</head>
<body data-widget="pomodoro">
  <main class="window window--lane" data-title="집중.exe">
    <div class="window__body pomodoro">
      <div class="pomodoro__head">
        <p class="caption" data-mode>집중</p>
        <p class="display" data-remaining role="timer">25:00</p>
      </div>
      <div class="pomodoro__controls">
        <button class="icon-btn" type="button" data-reset aria-label="처음으로" title="처음으로">
          <canvas class="icon" data-icon="restart"></canvas>
        </button>
        <button class="icon-btn icon-btn--main" type="button" data-toggle aria-label="시작" title="시작">
          <canvas class="icon" data-icon="play" data-toggle-icon></canvas>
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startPomodoro } from "./pomodoro.js";

    startPomodoro(startWidget("lane"));
  </script>
</body>
</html>
