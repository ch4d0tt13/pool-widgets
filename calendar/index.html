<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 달력</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="calendar.css">
</head>
<body data-widget="calendar">
  <main class="desk">
    <div class="desk__back">
      <section class="desk__page">
        <span class="desk__rings" aria-hidden="true"></span>
        <p class="caption" data-month></p>
        <div class="calendar__board" data-grid aria-label="이번 달 달력"></div>
        <p class="caption caption--plain" data-status hidden></p>
      </section>
    </div>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startCalendar } from "./calendar.js";

    // 창 대신 스프링 탁상 달력 (물 장면 없음)
    startWidget();
    startCalendar();
  </script>
</body>
</html>
