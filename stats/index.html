<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 이번 주 기록</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="stats.css">
</head>
<body data-widget="stats">
  <main class="stats">
    <div class="stats__chart" data-chart role="img"></div>
    <div class="stats__shelf" data-days aria-hidden="true"></div>
    <div class="stats__tag">
      <p class="caption caption--plain">
        <span class="stats__total is-focus">집중 <span data-total-focus>0</span>회</span>
        <span class="stats__total is-tidy">정리 <span data-total-tidy>0</span>개</span>
      </p>
    </div>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startStats } from "./stats.js";

    // 창 틀·물 장면 없이 선반과 물탱크만 (노션 바탕 위에 바로 놓인다)
    startWidget();
    startStats();
  </script>
</body>
</html>
