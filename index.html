<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 시계</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/widget.css">
</head>
<body>
  <canvas class="pool" aria-hidden="true"></canvas>

  <main class="panel">
    <p class="time" aria-live="off">
      <span data-hour>00</span><span class="time__colon">:</span><span data-minute>00</span>
      <span class="time__sec" data-second>00</span>
    </p>
    <time class="date" data-date></time>
  </main>

  <script type="module">
    import { startPool } from "./js/pool.js";
    import { startClock } from "./js/clock.js";

    const $ = (sel) => document.querySelector(sel);
    startPool($(".pool"));
    startClock({
      hour: $("[data-hour]"),
      minute: $("[data-minute]"),
      second: $("[data-second]"),
      date: $("[data-date]"),
    });
  </script>
</body>
</html>
