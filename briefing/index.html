<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 브리핑</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="briefing.css">
</head>
<body data-widget="briefing">
  <main class="board">
    <div class="board__face">
      <a class="note" data-link target="_blank" rel="noopener">
        <canvas class="icon icon--small note__pin" data-icon="pin-small" aria-hidden="true"></canvas>
        <canvas class="icon icon--small note__pin note__pin--right" data-icon="pin-small" aria-hidden="true"></canvas>
        <p class="caption caption--plain"><canvas class="icon icon--small" data-meta-icon hidden aria-hidden="true"></canvas><span data-meta>불러오는 중</span></p>
        <ul class="note__lines" data-lines></ul>
        <p class="note__footer" data-footer></p>
      </a>
    </div>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startBriefing } from "./briefing.js";

    // 창 대신 나무 게시판 (물 장면 없음)
    startWidget();
    startBriefing();
  </script>
</body>
</html>
