<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 빠른 메모</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="memo.css">
</head>
<body data-widget="memo">
  <main class="window window--deck" data-title="빠른메모.txt">
    <form class="window__body memo" data-form>
      <label class="sr-only" for="memo-text">메모 내용</label>
      <div class="memo__row">
        <input class="memo__input" id="memo-text" type="text" maxlength="2000" enterkeyhint="send"
          autocomplete="off" placeholder="떠오른 걸 적어 두세요">
        <button class="btn" type="submit" data-save>
          <canvas class="icon icon--small" data-icon="heart-small"></canvas><span data-save-label>저장</span>
        </button>
      </div>
      <p class="sr-only" data-status role="status"></p>
    </form>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startMemo } from "./memo.js";

    startWidget("deck");
    startMemo();
  </script>
</body>
</html>
