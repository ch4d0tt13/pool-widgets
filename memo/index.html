<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 빠른 메모</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="memo.css">
</head>
<body data-widget="memo">
  <main class="window window--deck" data-title="빠른메모.txt">
    <form class="window__body memo" data-form>
      <label class="sr-only" for="memo-text">메모 내용</label>
      <textarea class="memo__input" id="memo-text" rows="2" maxlength="2000"
        placeholder="떠오른 걸 적어 두세요 (Ctrl+Enter로 저장)"></textarea>
      <div class="memo__foot">
        <p class="caption caption--plain memo__status" data-status role="status" hidden></p>
        <button class="btn" type="submit" data-save>
          <canvas class="icon" data-icon="heart"></canvas>저장
        </button>
      </div>
    </form>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startMemo } from "./memo.js";

    startWidget("deck");
    startMemo();
  </script>
</body>
</html>
