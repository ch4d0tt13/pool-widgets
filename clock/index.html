<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 시계</title>
  <link rel="stylesheet" href="../shared/css/index.css">
</head>
<body data-widget="clock">
  <main class="window" data-title="시계.exe">
    <div class="window__body">
      <p class="display">
        <span data-hour>00</span><span class="blink">:</span><span data-minute>00</span>
        <span class="display__sub" data-second>00</span>
      </p>
      <time class="caption" data-date></time>
    </div>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startClock } from "./clock.js";

    startWidget("shallow");
    startClock();
  </script>
</body>
</html>
