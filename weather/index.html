<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 날씨</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="weather.css">
</head>
<body data-widget="weather">
  <main class="panel window window--sun" data-title="날씨.exe">
    <div class="window__body">
      <p class="caption" data-place></p>
      <div class="weather__now">
        <canvas class="weather__icon" data-icon-weather aria-hidden="true"></canvas>
        <p class="display" data-temp>--°</p>
      </div>
      <p class="weather__meta" data-desc>불러오는 중</p>
      <p class="weather__meta">
        <span>최고 <b data-max>--</b>°</span>
        <span>최저 <b data-min>--</b>°</span>
      </p>
    </div>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startWeather } from "./weather.js";

    startWeather(startWidget("shallow"));
  </script>
</body>
</html>
