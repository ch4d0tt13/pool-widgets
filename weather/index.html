<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 날씨</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="weather.css">
</head>
<body data-widget="weather">
  <main class="window window--sun" data-title="날씨.exe">
    <div class="window__body weather">
      <div class="weather__sky">
        <canvas class="weather__icon" data-icon-weather aria-hidden="true"></canvas>
        <p class="display" data-temp>--°</p>
      </div>
      <div class="weather__water">
        <p class="caption" data-place></p>
        <p class="caption caption--plain" data-desc>불러오는 중</p>
        <p class="caption caption--plain"><span>최고 <span data-max>--</span>° · 최저 <span data-min>--</span>°</span></p>
      </div>
    </div>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startWeather } from "./weather.js";

    startWeather(startWidget("sunny"));
  </script>
</body>
</html>
