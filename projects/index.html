<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수영장 프로젝트</title>
  <link rel="stylesheet" href="../shared/css/index.css">
  <link rel="stylesheet" href="projects.css">
</head>
<body data-widget="projects">
  <main class="basin">
    <div class="basin__deck">
      <div class="projects" data-pool>
        <p class="caption" data-count>불러오는 중</p>
        <ul class="projects__grid" data-grid></ul>
        <p class="caption caption--plain" data-status role="status" hidden></p>
      </div>
      <span class="basin__ladder" aria-hidden="true"></span>
    </div>
  </main>

  <script type="module">
    import { startWidget } from "../shared/js/widget.js";
    import { startProjects } from "./projects.js";

    // 창 대신 하얀 타일을 두른 작은 수영장: 제목 표시줄 없이 물 장면만
    startWidget("pebble");
    startProjects();
  </script>
</body>
</html>
